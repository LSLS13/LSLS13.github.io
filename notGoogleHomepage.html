<!DOCTYPE html>
<html>

        <title>Homepage</title>

        <!-- Local css -->
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;}
            body {
                background-color: white;}
            #topLeft {
                margin: 1.5em;

            #topRight {
